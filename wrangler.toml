# Konfigurace Cloudflare Pages (hosting, databáze D1, úložiště fotografií R2).
# Tajné hodnoty (klíče, hesla) sem NEPATŘÍ – nastavují se v Cloudflare jako Secrets.
name = "atelier-dante-time"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[vars]
# preview = katalog bez nákupu (výchozí) · test = zkušební nákupy · live = ostrý provoz (jen se souhlasem majitele)
SHOP_MODE = "preview"
EMAIL_PROVIDER = "none"

[[d1_databases]]
binding = "DB"
database_name = "dante-time"
# ID databáze doplní majitel po jejím vytvoření v Cloudflare (docs/CLOUDFLARE-SETUP.md)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Fotografie hodinek: Workers KV (zdarma, nevyžaduje platební kartu).
# ID doplní automatické nasazení z proměnné KV_NAMESPACE_ID (docs/CLOUDFLARE-SETUP.md).
[[kv_namespaces]]
binding = "MEDIA_KV"
id = "11111111111111111111111111111111"

# Volitelně místo KV úložiště R2 (vyžaduje platební kartu v účtu Cloudflare):
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "dante-time-media"
