# Konfigurace Cloudflare Pages (hosting, databáze D1, úložiště fotografií R2).
# Tajné hodnoty (klíče, hesla) sem NEPATŘÍ – nastavují se v Cloudflare jako Secrets.
name = "atelier-dante-time"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[vars]
# preview = katalog bez nákupu (výchozí) · test = zkušební nákupy · live = ostrý provoz (jen se souhlasem majitele)
SHOP_MODE = "preview"
EMAIL_PROVIDER = "none"

[[d1_databases]]
binding = "DB"
database_name = "dante-time"
# ID databáze doplní majitel po jejím vytvoření v Cloudflare (docs/CLOUDFLARE-SETUP.md)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dante-time-media"
